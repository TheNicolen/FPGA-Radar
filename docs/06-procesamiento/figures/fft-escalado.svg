<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img"><title>04 / Anchos intermedios y escala acumulada</title><desc>Contrato propuesto para N=512 · 9 etapas · mantener precisión antes de redondear y almacenar</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#142d4e}.mono{font-family:Consolas,monospace}.small{font-size:18px}.label{font-size:22px}</style>
<text x="48" y="55" font-size="32" fill="#142d4e" style="fill:#142d4e" font-weight="700" text-anchor="start">04 / Anchos intermedios y escala acumulada</text>
<text x="48" y="91" font-size="20" fill="#52657a" style="fill:#52657a" font-weight="400" text-anchor="start">Contrato propuesto para N=512 · 9 etapas · mantener precisión antes de redondear y almacenar</text>
<rect x="50" y="170" width="220" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="160.0" y="202" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Datos I/Q</text><text x="160.0" y="231" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W16 · F15</text>
<rect x="320" y="170" width="220" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="430.0" y="202" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Twiddle</text><text x="430.0" y="231" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W18 · F16</text>
<rect x="590" y="170" width="220" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="700.0" y="202" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Producto real</text><text x="700.0" y="231" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W34 · F31</text>
<rect x="860" y="170" width="220" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="970.0" y="202" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Producto complejo</text><text x="970.0" y="231" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W35 · F31</text>
<path d="M270,215 L310,215" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="288" y="202" font-size="24" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">×</text>
<path d="M540,215 L580,215" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M810,215 L850,215" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="1110" y="202" font-size="22" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="start">Conservar</text>
<text x="1110" y="234" font-size="22" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="start">bit de guarda</text>
<rect x="50" y="330" width="270" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="185.0" y="362" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Roundshift 16</text><text x="185.0" y="391" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W19 · F15</text>
<rect x="365" y="330" width="270" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="500.0" y="362" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">A ± T</text><text x="500.0" y="391" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W20 · F15</text>
<rect x="680" y="330" width="270" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="815.0" y="362" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Roundshift 1</text><text x="815.0" y="391" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">escala /2</text>
<rect x="995" y="330" width="270" height="90" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="1130.0" y="362" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Saturar y registrar</text><text x="1130.0" y="391" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W16 · F15</text>
<path d="M320,375 L355,375" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M635,375 L670,375" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M950,375 L985,375" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M970,260 L970,295 L185,295 L185,325" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="50" y="480" font-size="28" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="start">Nueve divisiones por dos → escala total 1/512</text>
<text x="50" y="523" font-size="24" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="start">Comparar con fft(x_cuantizado)/512, no directamente con fft(x).</text>
<rect x="50" y="566" width="600" height="140" rx="12" fill="#fff5e7" stroke="#c9d8e6" stroke-width="2"/><text x="350.0" y="598" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Margen de entrada</text><text x="350.0" y="627" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">La división por dos no garantiza seguridad</text><text x="350.0" y="656" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">para todas las entradas I/Q a escala completa.</text>
<rect x="680" y="566" width="650" height="140" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="1005.0" y="598" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Aritmética ≠ arquitectura física</text><text x="1005.0" y="627" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">Estos anchos no determinan DSP, BRAM ni latencia.</text><text x="1005.0" y="656" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">Hacen falta simulación bit-exact y síntesis.</text>
<line x1="48" y1="757" x2="1352" y2="757" stroke="#dce5ed" stroke-width="2"/>
<text x="48" y="785" font-size="18" fill="#52657a" style="fill:#52657a" font-weight="400" text-anchor="start">Diseño propuesto. W indica bits totales con signo; F indica bits fraccionarios. No es un esquema RTL sintetizado.</text>
</svg>
