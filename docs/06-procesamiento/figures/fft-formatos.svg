<line x1="127" y1="172" x2="127" y2="252" stroke="#ae3547" stroke-width="2"/>
<text x="50" y="352" font-size="26" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="start" class="mono">Ejemplo: 0100 0000 0000 0000 → entero 16384 → 0,5</text>
<rect x="50" y="398" width="405" height="150" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="252.5" y="430" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Rango de una componente</text><text x="252.5" y="459" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">−1 ≤ valor ≤ 0,9999694824</text><text x="252.5" y="488" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">Paso: 1 / 32768</text>
<rect x="485" y="398" width="405" height="150" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="687.5" y="430" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">El signo cuenta en Qm.n</text><text x="687.5" y="459" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">m incluye el bit de signo</text><text x="687.5" y="488" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">Q1.15 suma 16 bits</text>
<rect x="920" y="398" width="405" height="150" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="1122.5" y="430" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Twiddle propuesto: Q2.16</text><text x="1122.5" y="459" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">W = 18, F = 16</text><text x="1122.5" y="488" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">+1 y −1 sí son exactos</text>
<text x="50" y="607" font-size="25" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="start">I y Q pueden caber por separado y aun así tener |I + jQ| &gt; 1.</text>
<text x="50" y="645" font-size="23" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="start">Ejemplo: 0,9 + j0,9 tiene módulo ≈ 1,273. Hay que definir margen de entrada.</text>
<line x1="48" y1="690" x2="1352" y2="690" stroke="#dce5ed" stroke-width="2"/>
<text x="48" y="718" font-size="18" fill="#52657a" style="fill:#52657a" font-weight="400" text-anchor="start">Esquema explicativo. No fija todavía el formato óptimo ni demuestra ausencia de overflow.</text>
