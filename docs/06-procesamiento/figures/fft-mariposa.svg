<path d="M640,375 L690,375" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<line x1="650" y1="170" x2="690" y2="375" stroke="#176db0" stroke-width="2"/>
<line x1="650" y1="375" x2="690" y2="170" stroke="#057d80" stroke-width="2"/>
