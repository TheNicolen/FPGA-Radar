<path d="M1280,375 L1340,375" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="1345" y="179" font-size="25" fill="#142d4e" style="fill:#142d4e" font-weight="700" text-anchor="start">U</text>
<text x="1345" y="384" font-size="25" fill="#142d4e" style="fill:#142d4e" font-weight="700" text-anchor="start">V</text>
<text x="245" y="480" font-size="23" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="start" class="mono">W = cos(θ) − j·sin(θ)</text>
<path d="M332,455 L332,425" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="50" y="540" font-size="25" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="start">A = 0,5 + j0,25; B = 0,25 − j0,125; W = −j</text>
<text x="50" y="585" font-size="25" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="start" class="mono">T = −0,125 − j0,25     U = 0,1875     V = 0,3125 + j0,25</text>
<text x="50" y="632" font-size="21" fill="#52657a" style="fill:#52657a" font-weight="400" text-anchor="start">Cruces sin punto no conectan señales. El esquema no especifica ciclos ni pipeline.</text>
<line x1="48" y1="690" x2="1352" y2="690" stroke="#dce5ed" stroke-width="2"/>
<text x="48" y="718" font-size="18" fill="#52657a" style="fill:#52657a" font-weight="400" text-anchor="start">Ejemplo teórico exacto. Redondeo propuesto: al más cercano, empates alejándose de cero.</text>
