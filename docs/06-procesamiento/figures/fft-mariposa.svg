<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img"><title>02 / Mariposa radix-2 con aritmética fija</title><desc>T = B·W; U = (A + T)/2; V = (A − T)/2 · misma regla aplicada a real e imaginario</desc>
