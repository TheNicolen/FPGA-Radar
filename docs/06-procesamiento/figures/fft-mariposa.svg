<path d="M1015,170 L1050,170" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="1050" y="126" width="230" height="88" rx="12" fill="#edf4fa" stroke="#c9d8e6" stroke-width="2"/><text x="1165.0" y="158" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="600" text-anchor="middle">Saturar a 16 bits</text><text x="1165.0" y="187" font-size="21" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">registrar overflow</text>
<path d="M1280,170 L1340,170" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
