<text x="720" y="179" font-size="32" fill="#142d4e" style="fill:#142d4e" font-weight="400" text-anchor="middle">+</text>
<path d="M750,170 L815,170" stroke="#52657a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
