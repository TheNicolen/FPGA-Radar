<text x="48" y="55" font-size="32" fill="#142d4e" style="fill:#142d4e" font-weight="700" text-anchor="start">02 / Mariposa radix-2 con aritmética fija</text>
<text x="48" y="91" font-size="20" fill="#52657a" style="fill:#52657a" font-weight="400" text-anchor="start">T = B·W; U = (A + T)/2; V = (A − T)/2 · misma regla aplicada a real e imaginario</text>
